name: Odds pipeline

on:
  schedule:
    # UTC. 3 runs × 5 leagues × 1 credit ≈ 465 credits in a 31-day month; the script enforces the cap.
    - cron: "15 7,13,18 * * *"
  workflow_dispatch: # manual run: also costs ~5 credits

# Never two runs at once: they would race on the same rows and double-spend quota.
concurrency:
  group: odds-pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
  # Shared src/lib modules are ESM in a typeless package: silence Node's reparse notice.
  NODE_OPTIONS: --disable-warning=MODULE_TYPELESS_PACKAGE_JSON

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts

      # Results first, so finished matches leave the schedule before new tickets are built.
      - name: Ingest results
        if: ${{ env.FOOTBALL_DATA_API_KEY != '' }}
        run: node scripts/ingest-results.ts

      - name: Ingest odds
        if: ${{ !cancelled() }}
        run: node scripts/ingest-odds.ts
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_MONTHLY_CREDIT_CAP: ${{ vars.ODDS_API_MONTHLY_CREDIT_CAP || '470' }}

      # The script picks its own windows (07:00-08:59 and 13:00-14:59 UTC) and enforces the 90/day budget.
      - name: Ingest markets
        if: ${{ !cancelled() }}
        run: node scripts/ingest-markets.ts
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

      # Run even if one league failed to ingest: the others still deserve fresh analyses.
      - name: Analyse matches
        if: ${{ !cancelled() }}
        run: node scripts/analyze-matches.ts

      - name: Generate combos
        if: ${{ !cancelled() }}
        run: node scripts/generate-combos.ts
