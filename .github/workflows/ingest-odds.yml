name: Ingest odds

on:
  schedule:
    # UTC. 3 runs × 5 leagues × 1 credit ≈ 465 credits in a 31-day month; the script enforces the cap.
    - cron: "15 7,13,18 * * *"
  workflow_dispatch: # manual run: also costs ~5 credits

# Never two syncs at once: they would race on the same rows and double-spend quota.
concurrency:
  group: ingest-odds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - run: node scripts/ingest-odds.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_MONTHLY_CREDIT_CAP: ${{ vars.ODDS_API_MONTHLY_CREDIT_CAP || '470' }}
